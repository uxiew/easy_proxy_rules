# =============================================================================
# claude-guard 集中配置 —— 所有可调项只在这里改
#
# 格式：KEY=VALUE；`#` 开头为整行注释，也支持行内 `# 注释`；
#       值里的 `~/` 会展开成 $HOME；相对路径（白名单 / 检查脚本）相对本目录。
# 生效：改完后执行 `claude-guard-reload`，或新开一个终端窗口。
# 缺失/写错不会让守卫失效：claude-guard.zsh 里每项都有内置默认值兜底。
# 注意：这里只管「本机守卫」的参数；Claude 自己的 settings.json 见同目录
#       claude-settings.example.json，mihomo 端口定义见 ../README.md「端口分工」。
# =============================================================================

# ---- 住宅专用入口（mihomo 的 residential-in listener，只绑 127.0.0.1）----
# 改端口时记得同步改 ~/.claude/settings.json 的 HTTP(S)_PROXY 与 mihomo 覆写
PORT=7865
HOST=127.0.0.1

# ---- 环境指纹（与住宅出口所在地保持一致，避免 TZ 与 IP 自相矛盾）----
TZ=Asia/Tokyo

# ---- 出口 IP 查询 ----
# 串行短路：第一个成功就返回，绝不查后面的备用；只有失败才依次兜底。
# CONNECT_TIMEOUT 不要低于 3：curl 把代理 CONNECT 隧道建立算进连接阶段，
#   实测 1s 会 rc=28 误判超时（守卫会误拦）。
IP_SERVICES=https://api.ipify.org https://ifconfig.me/ip https://icanhazip.com
TIMEOUT_MAIN=6
TIMEOUT_BACKUP=3
CONNECT_TIMEOUT=3

# ---- 数据与脚本路径 ----
ALLOWED_IPS_FILE=allowed-exit-ips
CONFIG_CHECK=config-check.mjs

# config-check.mjs 用的 node。留空 = 用 PATH 里的 node；
# 写成绝对路径可保证 IDE / 非登录 shell 里体检也能跑。
NODE_BIN=/opt/homebrew/bin/node

# claude-check 读 DNS enhanced-mode 用的 mihomo 配置
MIHOMO_CONFIG=~/Library/Application Support/mihomo-party/work/config.yaml

# 启动路径是否检查 IPv6 全局地址。1 = 查（多一次 ifconfig，本机约 100ms）；
# 0 = 不查，把这项完全交给手动 claude-check。默认 1 保持原有行为。
CHECK_IPV6=1
