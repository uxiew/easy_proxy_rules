# ============================================================
# 住宅出口（Webshare 静态住宅 IP）—— 覆写 YAML 模板
# ============================================================
# 用途：只放「连接信息」这种敏感内容，配合 smart.js 使用。
#   smart.js 负责：建组「住宅出口」+ 决定哪类规则走住宅（逻辑，公开）
#   ruleset/residential.list 负责：具体哪些域名走住宅（一行一个，随时改）
#   本文件负责：节点地址/账号/密码/跳板（密钥，私有不提交）
#
# ⚠️ 没有家宽静态 IP 的用户：不要用本文件。
#    把 smart.js 里的 RESIDENTIAL.enabled 改成 false 即可 —— 住宅出口 / 前置-亚洲
#    两个组都不生成，住宅节点自动移除，相关规则全部改投 AI 组，其它照旧。
#    本文件一旦导入，里面的 +proxies 节点会让「组不存在」变成 proxy not found 拒载。
#
# 用法：
#   1. Clash Party → 覆写 → 新建（或导入本地文件）→ 把下面内容粘进去、填好凭据 → 保存
#   2. 设为「全局」覆写（和 smart.js 一样）。
#      默认 RESIDENTIAL.enabled: true，本文件排在 smart.js 前 / 后都行：
#      「住宅出口」组用 include-all-proxies + filter 在内核侧收编，
#      后置注入的 🏠/IP- 节点照样进组。
#      ⚠️ 把 enabled 改成 'auto' 不推荐：它仍有效，但判的是「脚本运行时看不看得到
#         住宅节点」，不是「你有没有家宽」。本文件必须排在 smart.js **前面**，否则
#         有家宽也会被误判成「没有家宽」→ 两组都不生成、AI 规则改投 AI 组，
#         行为与 enabled: false 相同（AI 静默走机场共享 IP，不报错）。没有家宽请直接用
#         enabled: false，别指望 auto 替你判断。
#   3. 重载配置后到「代理」页，把「住宅出口」组切到 🏠 住宅-xxx
#
# ⚠️ 三个必须注意的点：
#   1. 第一行必须是 `+proxies` 而不是 `proxies`：
#      不带 `+` 会把机场的全部节点整体替换掉，直接全网断流。
#   2. 节点名必须带 🏠 前缀（如 🏠 住宅-JP）或 IP- 前缀（如 IP-JP），对应 smart.js 里的
#      RESIDENTIAL.nodePattern = 🏠|IP-，否则不会被收编进「住宅出口」组。
#      ⚠️ 别用「住宅」两个字当匹配词——很多机场自带「家宽住宅」节点，会被误收。
#   3. 不要在这里重复定义名为「住宅出口」的组，会和 smart.js 建的组重名报错。
# ============================================================

+proxies:
  # ---------- 美国静态住宅（示例，把 4 个值换成 Webshare 后台的） ----------
  - name: '🏠 住宅-US' # 名字前缀（🏠 或 IP-）决定它会被收编进「住宅出口」组
    type: socks5 # ⚠️ 必须 socks5：mihomo 的 http 类型配 dialer-proxy 实测连不通（内核层面）
    server: 203.0.113.10 # ← 换成你的静态住宅 IP
    port: 12345 # ← 换成端口
    username: 'your-username' # ← 换成用户名
    password: 'your-password' # ← 换成密码
    udp: false # 住宅代理基本不支持 UDP，保持 false（QUIC 会自动回落 TCP）
    # ⚠️ 链式代理的核心：先经机场节点出去，再由住宅 IP 落地。
    #    删掉这一行 = 本机直连住宅 IP（国内通常又慢又抖，不建议）。
    #    可选值：前置-亚洲（本脚本建的组：任意亚洲节点自动择优——日本为主，
    #            HK/TW/KR/SG/越南/马来/泰/菲 一起备选，全灭则阻断，推荐）
#            或 AUTO（全机场自动择优，中转会跳美/欧）/ 具体节点名（完全固定）
    dialer-proxy: 前置-亚洲

  # ---------- 备用写法：SOCKS5 + HTTPS 代理 ----------
  # - name: '🏠 住宅-UK'
  #   type: socks5
  #   server: 203.0.113.11
  #   port: 1080
  #   username: 'your-username'
  #   password: 'your-password'
  #   udp: false
  #   dialer-proxy: 前置-亚洲
  #
  # - name: '🏠 住宅-DE'      # 如果 Webshare 给的是 https:// 代理
  #   type: http
  #   tls: true
  #   server: 203.0.113.12
  #   port: 443
  #   username: 'your-username'
  #   password: 'your-password'
  #   dialer-proxy: 前置-亚洲

# ------------------------------------------------------------
# 可选：临时给某些域名补规则（不改 smart.js 也能加）
# 规则会插到最前面，优先级高于 smart.js 里的住宅规则和所有 RULE-SET。
# ⚠️ 这些规则指向「住宅出口」：把 RESIDENTIAL.enabled 设为 false（无家宽）时，
#    该组不存在，内核会报 proxy not found 并拒载整份配置 —— 必须一起删掉。
#    另外 challenges.cloudflare.com / withpersona.com 已在 ruleset/ai-strict.list 里，
#    不要在这里重复写 DOMAIN, 版本（曾导致 rules[0] not found 整份配置加载失败）。
# ------------------------------------------------------------
# +rules:
#   - DOMAIN-SUFFIX,perplexity.ai,住宅出口
#   - DOMAIN-SUFFIX,notion.so,住宅出口
