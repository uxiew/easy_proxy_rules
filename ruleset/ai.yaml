# ============================================================
# AI 相关，但「不适合走住宅」的规则 → AI 组（机场）
# ============================================================
# 与 ruleset/ai-strict.list 的分工（两者不重复，各管一段）：
#
#   ai-strict.list  → 住宅出口  严格 AI 服务商的精确域名 + 人机验证 + 遥测 + 支付
#   本文件          → AI 组     宽泛匹配、Google 全量、非严格 AI、非 AI 杂项
#
# 为什么不能合并成一个文件：
#   一条 RULE-SET 只能指向一个策略组。两类目标不同（住宅 vs 机场），
#   物理上必须是两个 rule-provider。能做的只是「去重 + 划清边界」。
#
# 已删除的冗余（原文件与 ai-strict.list 完全重复，且 ai-strict 规则排更前）：
#   anthropic / claude / openai / sentry / statsig / auth0 / stripe / intercom /
#   livekit / arkoselabs / challenges.cloudflare / cursor / perplexity / midjourney /
#   manus / grok / x.ai / x.com / poe / mistral / groq / cohere / augmentcode …
#
# ⚠️ 本文件保留的 KEYWORD / REGEX 一律走机场，绝不放进住宅清单：
#   DOMAIN-REGEX,google.* 会命中 googlevideo.com（YouTube 视频流），
#   丢给住宅就是几 GB 流量按 GB 计费。
# ============================================================

payload:

  # ========== 宽泛匹配（只能走机场：会命中大量非 AI 流量）==========
  - DOMAIN-KEYWORD,anthropic
  - DOMAIN-KEYWORD,claude
  - DOMAIN-KEYWORD,openai
  - DOMAIN-KEYWORD,sentry
  - DOMAIN-KEYWORD,datadog
  - DOMAIN-KEYWORD,sift
  - DOMAIN-KEYWORD,cursor
  - DOMAIN-REGEX,cursor.*
  - DOMAIN-KEYWORD,midjourney
  - DOMAIN-REGEX,midjourney.*
  - DOMAIN-KEYWORD,augmentcode
  - DOMAIN-REGEX,augmentcode.*
  - DOMAIN-KEYWORD,cohere
  - DOMAIN-KEYWORD,coze
  - DOMAIN-KEYWORD,groq
  - DOMAIN-KEYWORD,ping0
  - DOMAIN-KEYWORD,cognitive.microsofttranslator

  # ========== Google / Gemini（默认走机场，不走住宅）==========
  # googleapis / gstatic 是 Google 全家共用（YouTube、Drive、地图），
  # 塞给住宅会烧掉大量流量，所以 Gemini 默认不开住宅。
  - DOMAIN,aistudio.google.com
  - DOMAIN,gemini.google.com
  - DOMAIN,bard.google.com
  - DOMAIN,makersuite.google.com
  - DOMAIN-SUFFIX,googleapis.com
  - DOMAIN-SUFFIX,googleapis.cn
  - DOMAIN-SUFFIX,gstatic.com
  - DOMAIN-REGEX,google.*
  - DOMAIN-KEYWORD,google

  # ========== 非严格 AI / 目录站 / 中转（走机场，不烧住宅流量）==========
  - DOMAIN-SUFFIX,mcp.so
  - DOMAIN-SUFFIX,modelcontextprotocol.io
  - DOMAIN-SUFFIX,immersivetranslate.com
  - DOMAIN-SUFFIX,z.ai
  - DOMAIN-SUFFIX,nightyu.com
  - DOMAIN-SUFFIX,daiju.live
  - DOMAIN-SUFFIX,grazie.ai
  - DOMAIN-SUFFIX,grazie.aws.intellij.net
  - DOMAIN-SUFFIX,neuroapi.host
  - DOMAIN-SUFFIX,codeium.com

  # ========== 非 AI 的通用服务（原来混在 AI 清单里）==========
  - DOMAIN-SUFFIX,figma.com
  - DOMAIN-SUFFIX,bing.com
  - DOMAIN-SUFFIX,microsofttranslator.com
  - DOMAIN-SUFFIX,edge.microsoft.com
  - DOMAIN-SUFFIX,discord.com
  - DOMAIN-SUFFIX,discord.gg
  - DOMAIN-SUFFIX,discordapp.com
  - DOMAIN-SUFFIX,discordapp.net

  # ========== Apple 智能（部分）==========
  # apps.mzstatic.com / gateway.icloud.com / smoot.apple.com / apple-dns.net 等
  # 已从这里删除，交给 RULE-SET,apple → DIRECT（TRAFFIC.appleDirect），省机场流量。
  # 只留 iCloud Private Relay：它本身是代理服务，直连不通，只能走机场。
  - DOMAIN-SUFFIX,apple-relay.apple.com
  - DOMAIN-SUFFIX,apple-relay.cloudflare.com
  - DOMAIN-SUFFIX,apple-relay.fastly-edge.com
  - DOMAIN-KEYWORD,apple-relay

  # ========== 小众协议 / 兜底 ==========
  - DOMAIN-SUFFIX,circumlunar.space
  - DOMAIN-SUFFIX,vulpes.one
  - DOMAIN-SUFFIX,mozz.us
  - DOMAIN-SUFFIX,conman.org
  - DOMAIN-SUFFIX,bortzmeyer.org
