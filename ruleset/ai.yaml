# 注意：在 Clash 引入该 Provider 时，behavior 建议设置为 classical
payload:
  # ==========================================
  # 🔴 第一优先级：Claude 终极防封与兜底拦截
  # ==========================================

  # 1. IP 与 ASN 底层强制兜底 (防 DNS 泄露，一旦域名漏配直接锁死 IP)
  - IP-ASN,399358,no-resolve
  - IP-CIDR,160.79.104.0/21,no-resolve
  - IP-CIDR6,2607:6bc0::/32,no-resolve
  - IP-CIDR6,2607:6bc0::/48,no-resolve

  # 2. 封堵隐蔽探针与遥测 (防止 Datadog/Sentry 抓取你的国内真实 IP 发送给官方)
  - DOMAIN-KEYWORD,sentry
  - DOMAIN-SUFFIX,sentry.io
  - DOMAIN-SUFFIX,statsigapi.net
  - DOMAIN,cdn.growthbook.io

  # 3. NTP 时区强制伪装 (解决肉身系统时间与 IP 所在时区不符的风控)
  # 注意：这需要 Clash 开启 UDP 转发
  - GEOSITE,category-ntp

  # 4. Anthropic 官方大类全量兜底
  - GEOSITE,anthropic

